{% extends "base.html" %}{% block title %}Sign in · Trouveur{% endblock %}
{% block content %}
<div class="login">
  <h1><img src="/static/logo.png" alt="" class="logo">Trouveur</h1>
  {% if error %}<p class="notice bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Email<input name="email" type="email" value="{{ attempted }}" autocomplete="username" autofocus required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="actions"><button class="primary" type="submit">Sign in</button></p>
  </form>
  <p class="hint">Accounts are created for you by an administrator. The first one on a new
    installation is made on the server with <code>trouveur create-user</code>.</p>
</div>
{% endblock %}
