{% extends "base.html" %}
{% block title %}Sign in — Trouveur{% endblock %}
{% block content %}
<div style="max-width:380px;margin:10vh auto 0">
  <div class="brand" style="font-size:1.3rem;margin-bottom:var(--space-6);justify-content:center">
    <span class="dot"></span>Trouveur
  </div>
  <div class="card">
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <input class="btn primary" type="submit" value="Sign in" style="width:100%;margin-top:var(--space-5)">
    </form>
  </div>
  <p class="hint" style="text-align:center;margin-top:var(--space-4)">
    No sign-up. The single login is created on the server with <code>trouveur create-user</code>.
  </p>
</div>
{% endblock %}
