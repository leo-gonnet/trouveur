{% extends "base.html" %}{% block title %}Sign in · Trouveur{% endblock %}
{% block content %}
<div class="login">
  <h1>{% include "_logo.html" %}Trouveur</h1>
  {% if error %}<p class="notice bad">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username<input name="username" autocomplete="username" autofocus required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="actions"><button class="primary" type="submit">Sign in</button></p>
  </form>
  <p class="hint">Accounts are created on the server with <code>trouveur create-user</code>.</p>
</div>
{% endblock %}
