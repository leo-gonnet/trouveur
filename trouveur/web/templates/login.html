{% extends "base.html" %}{% block title %}Sign in · Trouveur{% endblock %}
{% block content %}
<div class="login">
  <h1><span class="dot"></span> Trouveur</h1>
  {% if error %}<p class="notice danger">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Username<input name="username" autocomplete="username" autofocus required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <p class="hint">Accounts are created on the server with <code>trouveur create-user</code>.</p>
</div>
{% endblock %}
