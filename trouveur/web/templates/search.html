{% extends "base.html" %}{% block title %}Search · Trouveur{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Search</h1>
  <p class="hint">
    Every posting collected, whatever the filters decided — including rejected, unscored and
    closed ones. This is the view of what was actually scraped.
  </p>
</div>

<form class="searchbar" hx-get="/search" hx-target="#results" hx-push-url="true"
      hx-trigger="submit, change from:select, change from:input[type=checkbox]">
  <input name="q" value="{{ q }}" placeholder="Title, company, description…" autofocus>
  <select name="country">
    <option value="">Any country</option>
    {% for code in ['AT','DE','CH','NL','FR','GB','US'] %}
      <option value="{{ code }}" {% if country==code %}selected{% endif %}>{{ code }}</option>
    {% endfor %}
  </select>
  <select name="work_mode">
    <option value="">Any work mode</option>
    {% for mode in ['remote','hybrid','onsite','unknown'] %}
      <option value="{{ mode }}" {% if work_mode==mode %}selected{% endif %}>{{ mode }}</option>
    {% endfor %}
  </select>
  <label class="check">
    <input type="checkbox" name="include_closed" value="true" {% if include_closed %}checked{% endif %}>
    include closed
  </label>
  <button class="primary" type="submit">Search</button>
</form>

<div id="results">{% include "_results.html" %}</div>
{% endblock %}
