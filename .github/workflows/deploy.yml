name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Runs alongside the tests and pushes only the commit's own tag, which nothing runs until deploy
  # names it. :latest is compose's fallback tag, so it moves in deploy, after the tests pass.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Recomputed, not passed from build: the name matches a secret in this repo's logs, and
      # GitHub drops a job output that looks like one.
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - run: >-
          docker buildx imagetools create
          -t ${{ steps.image.outputs.ref }}:latest
          ${{ steps.image.outputs.ref }}:${{ github.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/trouveur
            PREV_TAG=$(sed -n 's/^TROUVEUR_TAG=//p' .env | tail -n 1)
            if grep -q '^TROUVEUR_TAG=' .env; then
              sed -i "s/^TROUVEUR_TAG=.*/TROUVEUR_TAG=${{ github.sha }}/" .env
            else
              echo "TROUVEUR_TAG=${{ github.sha }}" >> .env
            fi
            docker compose pull
            docker compose run --rm migrate
            docker compose up -d --remove-orphans
            docker image ls ${{ steps.image.outputs.ref }} --format '{{.Tag}}' \
              | awk -v new=${{ github.sha }} -v prev="$PREV_TAG" '$0 != new && $0 != prev && $0 != "<none>"' \
              | xargs -r -I{} docker image rm ${{ steps.image.outputs.ref }}:{}
            docker image prune -f
